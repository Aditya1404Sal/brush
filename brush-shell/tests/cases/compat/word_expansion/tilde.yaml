name: "Tilde expansion"
cases:
  - name: "Tilde expansion: basic"
    home_dir: .
    stdin: |
      test_root=$(realpath $(pwd))

      mkdir subdir
      cd subdir

      D=~
      D=$(realpath $D)
      echo "~: ${D//${test_root}/TEST_ROOT}"

  - name: "Tilde expansion: explicit user"
    home_dir: .
    stdin: |
      test_root=$(pwd)

      D=~root
      echo "~root: $D"

      D=~nonexistentuserwhodoesnotexist
      echo "~<non-existent-username>: $D"

  - name: "Tilde expansion: working dirs"
    home_dir: .
    stdin: |
      test_root=$(pwd)

      mkdir subdir
      cd subdir

      D=~+
      echo "~+: ${D//${test_root}/TEST_ROOT}"

      D=~-
      echo "~-: ${D//${test_root}/TEST_ROOT}"

      unset OLDPWD
      D=~-
      echo "~- (without OLDPWD): ${D//${test_root}/TEST_ROOT}"

  - name: "Tilde expansion: dir stack"
    stdin: |
      test_root=$(pwd)

      for name in a b c d e f g; do
        mkdir $name
        pushd $name >/dev/null 2>&1
      done

      D=~2
      echo "~2: ${D//${test_root}/TEST_ROOT}"

      D=~9
      echo "~9: ${D//${test_root}/TEST_ROOT}"

      D=~+2
      echo "~+2: ${D//${test_root}/TEST_ROOT}"

      D=~+9
      echo "~+9: ${D//${test_root}/TEST_ROOT}"

      D=~-2
      echo "~-2: ${D//${test_root}/TEST_ROOT}"

      D=~-9
      echo "~-9: ${D//${test_root}/TEST_ROOT}"

  - name: "Tilde expansion: after colons"
    home_dir: .
    stdin: |
      test_root=~

      D=something:~
      echo "D: ${D//${test_root}/TEST_ROOT}"

      D=something":"~
      echo "D: ${D//${test_root}/TEST_ROOT}"

      D=something:"~"
      echo "D: ${D//${test_root}/TEST_ROOT}"

      D=something:~:another:~
      echo "D: ${D//${test_root}/TEST_ROOT}"

  - name: "Tilde expansion: unexpanded tildes"
    home_dir: .
    stdin: |
      test_root=$(pwd)

      D="~"
      echo "D: ${D//${test_root}/TEST_ROOT}"

      D=x~
      echo "D: ${D//${test_root}/TEST_ROOT}"

  - name: "Tilde expansion: colon context sensitivity"
    env:
      HOME: /testhome
    stdin: |
      # Tilde at word start always expands (in both contexts)
      echo "echo tilde: $(echo ~)"
      var=~
      echo "assignment tilde: ${var}"

      # Tilde after colon: should NOT expand in non-assignment context
      echo "echo with colon: $(echo ~:~/bin)"
      echo ~:~/bin

      # But SHOULD expand in assignment context
      var=~:~/bin
      echo "assignment with colon: ${var}"

      # Complex PATH-like example
      PATH=/usr/bin:~:/bin:~/local
      echo "PATH: ${PATH}"

  - name: "Tilde expansion: assignment-like words"
    env:
      HOME: /testhome
    stdin: |
      # Words that look like assignments get tilde expansion after their first `=` and after
      # colons, wherever a command-line word appears; values, array elements, parameter words
      # and here-strings do not, nor does anything in POSIX mode.
      echo x=~/y x=~ x+=~ a[1]=~/z x=a:~/b:~ y=x=~
      echo --prefix=~/x 1x=~ x-y=~ "x=~" x="~" x=a~ x=a:"~"
      for w in x=~ y=~/z; do echo "$w"; done
      case x=/testhome in x=~) echo case-matched;; esac
      [[ x=~ == x=/testhome ]] && echo dbl
      y=x=~:~; echo "$y"
      a=(x=~ q); echo "${a[0]}"
      echo "${u:-x=~}"
      cat <<< x=~
      echo {x=~,y}
      f() { echo "$1"; }; f x=~
      set -o posix
      echo x=~/posix

  - name: "Tilde expansion: parameter defaults"
    env:
      HOME: /testhome
    stdin: |
      echo "Use default value with tilde"
      unset myvar
      echo "Default: ${myvar:-~}"
      echo "myvar after :-: ${myvar}"

      echo "Assign default value with tilde"
      unset myvar
      echo "Assign default: ${myvar:=~}"
      echo "myvar after :=: ${myvar}"

      echo "Use default with colon-tilde"
      unset myvar2
      echo "Default colon-tilde: ${myvar2:-~:~/bin}"

      echo "Assign default with colon-tilde"
      unset myvar3
      echo "Assign colon-tilde: ${myvar3:=~:~/bin}"
      echo "myvar3 after := ${myvar3}"

  - name: "Tilde expansion: out-of-range dir stack index"
    stdin: |
      # A run of digits too large to fit the dir-stack index type isn't a valid
      # index, so the tilde word falls back to (failed) username lookup and is
      # left unexpanded, same as an ordinary nonexistent user.
      D=~99999999999999999999
      echo "D: $D"

      D=~-99999999999999999999
      echo "D: $D"

      D=~+99999999999999999999
      echo "D: $D"

  - name: "Tilde expansion in list"
    env:
      HOME: .
    test_files:
      - path: "file.txt"
      - path: "file.txt.bak"
    stdin: |
      echo ~/{file.txt,file.txt.bak}
